name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.5
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Audit dependencies
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high

      - name: Build extension
        run: npm run build

      - name: Verify tag and production build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run verify:build

      - name: Package release files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="myproxy-extension-${RELEASE_TAG}.zip"
          cd dist
          zip -q -r -9 "../${archive}" .
          cd ..
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "${RELEASE_TAG}" \
            "myproxy-extension-${RELEASE_TAG}.zip" \
            "myproxy-extension-${RELEASE_TAG}.zip.sha256" \
            --verify-tag \
            --generate-notes \
            --title "MyProxy ${RELEASE_TAG}"
